name: CodeQL

# SAST gate. Static analysis of the JS/TS sources for security bugs (injection,
# auth, path traversal, etc.). Findings land in the repo Security tab → Code
# scanning — they do NOT fail the PR by default (CodeQL reports, it doesn't gate),
# so this is safe to add to a live app. The weekly schedule re-scans unchanged
# code against newly-shipped CodeQL queries.
#
# All actions are pinned to a full commit SHA (matches the repo convention in
# ci.yml / api.yml / web.yml). SARIF upload to the Security tab is free on this
# public repo (it needs GitHub code-scanning, which public repos get at no cost).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 04:27 UTC. Off-the-hour per GitHub's guidance (top-of-hour crons are
    # oversubscribed and start late).
    - cron: '27 4 * * 1'
  workflow_dispatch:

# Least privilege at the workflow level; the analyze job widens to what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload code-scanning results
      contents: read # checkout
      actions: read # read workflow metadata (required for some setups)
    strategy:
      fail-fast: false
      matrix:
        # Single combined identifier covers both JS and TS in one analysis.
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          # No compiled language here, so CodeQL needs no build step.
          build-mode: none
          # Inline config (single source of truth): the broader security suite
          # plus path exclusions.
          #   - queries: security-extended — security-only, no code-quality noise.
          #   - paths-ignore — exclude test files. A unit/integration test mounts
          #     bespoke Express routes and fixtures to exercise middleware in
          #     isolation (e.g. requireAuth.test.ts's
          #     `app.get('/auth-only', requireAuth, …)`), which trips production
          #     web-security queries such as js/missing-rate-limiting even though
          #     the route is never a real HTTP surface. Test code is not a deployed
          #     attack surface; every NON-test (production) file is still fully
          #     analyzed, so this drops a class of false positives without reducing
          #     real coverage.
          config: |
            queries:
              - uses: security-extended
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.spec.ts'
              - '**/*.spec.tsx'
              - frontend/e2e/**

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: '/language:${{ matrix.language }}'
