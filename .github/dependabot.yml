# Dependabot — automated dependency + base-image + action updates.
# Closes a 2026-06-12 DevSecOps-review gap: the "npm audit → 0 vulns" claim was a
# one-time manual check, so a new advisory against a locked dep (or a stale,
# CVE-laden base-image digest, or an outdated pinned action) would go unnoticed
# between manual reviews. Dependabot opens a PR per update; CI (ci.yml + the
# Trivy/CodeQL scans) gates each one. Grouped to keep PR volume sane.
version: 2
updates:
  # --- npm (monorepo: one hoisted lockfile at the root covers both workspaces) ---
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major bumps; majors (which can break) come separately.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    # Runtime-coupled / breaking majors are pinned deliberately (2026-06-13). These
    # are NOT "forgotten" bumps — adopting them is a conscious migration, not an
    # auto-merge. Remove an entry here when you decide to do that migration.
    ignore:
      # @types/node must MATCH the runtime major (the app builds + runs on Node 20).
      # @types/node 25 would expose Node-25 APIs that don't exist at runtime — a
      # latent bug. Keep it tracking the runtime: bump only when the Node base
      # image below moves. (Minor/patch within 20.x still flow.)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors change compiler behaviour repo-wide (e.g. 6.0 turns the
      # `baseUrl` deprecation into a hard error). Adopt deliberately + fix tsconfig,
      # don't take it the week it ships. 5.x minor/patch still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pino majors require a coordinated pino-http + pino-pretty upgrade (pino 10
      # breaks pino-http 10 -> `logger[stringifySym] is not a function`). 9.x
      # minor/patch still flow.
      - dependency-name: "pino"
        update-types: ["version-update:semver-major"]
      # pino-http 11 bumps its own pino dependency to ^10, so it drags in the pino
      # 10 major above out of band — the app's pino-9 logger then throws
      # `logger[stringifySym] is not a function` on every request. Pinned in
      # lockstep with `pino`: adopt both as one deliberate migration. 10.x flows.
      - dependency-name: "pino-http"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 6+ folds the React Compiler rule set into its
      # `recommended` preset (react-hooks/purity, set-state-in-effect,
      # incompatible-library, …), which flags pre-existing, intentional patterns
      # (prop-sync setState-in-effect, Date.now timestamps, RHF watch()) as hard
      # errors. Adopting it is a deliberate lint migration + code refactor, not a
      # weekly auto-bump. 5.x minor/patch still flow.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6+ imports `vite/internal` and requires Vite 7; the
      # frontend is on Vite 6, so the bump fails the build (ERR_PACKAGE_PATH_NOT_EXPORTED).
      # It's coupled to a Vite-7 major — adopt both together as a deliberate
      # migration. 4.x/5.x minor/patch still flow.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # Prisma 7 is a breaking DB-layer migration: `datasource.url` is removed from
      # schema.prisma in favour of prisma.config.ts + a driver adapter passed to the
      # PrismaClient constructor (P1012). That touches migrate-on-boot and the worker
      # on a live prod DB — a conscious migration, not a weekly bump. 6.x flows.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # Zod 4 removes the `invalid_type_error` / `required_error` constructor
      # options the env validator relies on (env.ts) and reworks the error/issue
      # API repo-wide — a validation-layer migration, not a weekly bump. It also
      # parses (typechecks) every schema differently, so adopting it is a
      # deliberate pass over every z.* call. 3.x minor/patch still flow.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # ESLint 10's plugin ecosystem hasn't caught up: eslint-plugin-import,
      # eslint-plugin-jsx-a11y and eslint-plugin-react-hooks (pinned 5.x) all cap
      # their peer at `eslint ^9`, so v10 breaks the lint stack at install/run.
      # Adopt once those plugins ship v10 support. 9.x minor/patch still flow.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Vite is coupled to @vitejs/plugin-react (pinned at major 4, peer
      # `vite ^4 || ^5 || ^6`). Bumping Vite alone to 7/8 is an officially
      # unsupported pairing on the prod build pipeline even when CI happens to
      # pass — adopt Vite + plugin-react together as one migration. 6.x flows.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # lucide-react v1 dropped the brand icons (the `Github` glyph used on the
      # landing + dashboard is gone) and reworks exports — adopting it needs an
      # icon migration (swap to an inline mark / non-brand icon), not a weekly
      # auto-bump. 0.x minor/patch still flow.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions (keeps the SHA pins fresh; Dependabot updates pin + comment) ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  # --- Docker base images (one entry per Dockerfile dir; keeps digest pins current,
  #     e.g. the node:20-alpine HIGHs the Trivy triage left as "cron tracks") ---
  # `node` major is pinned to the runtime LTS (Node 20) in every dir: the whole
  # app is built + tested on Node 20, so jumping the base image to a brand-new
  # non-LTS major (Dependabot proposed node:26-alpine) would ship an untested
  # runtime straight to the live app via auto-deploy. Moving to the next LTS is a
  # deliberate migration — bump @types/node in lockstep and drop the matching
  # ignore. Digest/patch refreshes within 20-alpine still flow (the whole point of
  # this ecosystem entry). kaniko/nginx bumps are unaffected.
  - package-ecosystem: docker
    directory: "/backend"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/frontend"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/worker"
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
