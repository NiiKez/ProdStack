# Security response headers for prodstack-web (the public web origin).
#
# These cover the HTML DOCUMENT and the JS bundle the browser actually renders —
# the backend's helmet CSP only rides on API JSON responses and never reaches the
# page served by nginx. See SECURITY review finding H1.
#
# nginx gotcha: `add_header` directives do NOT inherit into a `location` that
# declares its OWN `add_header` (e.g. the cache-control on /assets/ and
# /index.html). So this snippet is `include`d BOTH at the `server {}` level AND
# inside every location that sets its own add_header — otherwise those responses
# (the SPA shell + the hashed assets) would silently ship with zero security
# headers. Keep every directive `always` so they also apply to error responses.
#
# CSP rationale (verified against frontend/src + frontend/index.html):
#   - script-src 'self'            : no inline <script>, no eval/new Function, no
#                                    external CDN. index.html loads one module
#                                    script by src; Vite emits same-origin hashed
#                                    chunks under /assets/. NO 'unsafe-inline'/
#                                    'unsafe-eval' — the bundle does not need them.
#   - style-src 'self' 'unsafe-inline' : Radix UI injects INLINE positioning
#                                    styles (popovers/tooltips/dialogs) — required.
#   - img-src 'self' data: https://avatars.githubusercontent.com : GitHub OAuth
#                                    avatars (Avatar.tsx <img src=avatarUrl>).
#   - font-src 'self'             : @fontsource-variable fonts are bundled locally
#                                    into /assets/ — no external font origin.
#   - connect-src 'self'          : the API + the SSE log stream are reverse-proxied
#                                    same-origin under /api + /builds (EventSource).
#   - frame-ancestors 'none'      : clickjacking defence (pairs with X-Frame-Options).
#   - frame-src 'none'            : app embeds no <iframe>; explicit deny (would
#                                    otherwise fall back to default-src 'self').
#   - worker-src 'self'           : app uses no web workers today; explicit so a
#                                    future worker is same-origin only.

server_tokens off;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; frame-src 'none'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
